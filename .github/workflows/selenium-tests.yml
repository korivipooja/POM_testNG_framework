name: Selenium Automation Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Check Java version
        run: java -version

      - name: Check Maven version
        run: mvn -version

      - name: Run Selenium Tests
        run: mvn clean test -e -X

      - name: Upload Maven reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
              name: maven-test-reports
              path: |
                target/surefire-reports/
                target/*.log